<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ลงทะเบียนนักศึกษา</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ธีม: บัตรนักศึกษา — โคบอลต์ + เหลืองแสง บนพื้นสีหมอกม่วงอ่อน */
    :root {
      --ink: #0e1330;
      --muted: #5b6285;
      --cobalt: #2438d6;
      --cobalt-deep: #1a2aa8;
      --sun: #ffc93c;
      --mist: #eef0fb;
      --paper: #ffffff;
      --line: #d9ddf2;
      --danger: #c62828;
      --font-display: "Prompt", "IBM Plex Sans Thai", system-ui, sans-serif;
      --font-body: "IBM Plex Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.65;
      color: var(--ink);
      background-color: var(--mist);
      background-image: radial-gradient(rgba(36, 56, 214, 0.09) 1.2px, transparent 1.2px);
      background-size: 22px 22px;
      min-height: 100vh;
    }
    h1, h2 { font-family: var(--font-display); margin: 0; line-height: 1.25; }
    a { color: var(--cobalt); }
    :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

    /* ปุ่ม */
    button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border: 0; border-radius: 12px;
      font: inherit; font-weight: 600; color: #fff;
      background: var(--cobalt); box-shadow: 0 4px 0 var(--cobalt-deep);
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
    }
    button:hover { background: #2b42ea; }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--cobalt-deep); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 var(--cobalt-deep); }

    /* ฟอร์ม */
    label { display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 6px; }
    .req { color: var(--danger); }
    input, select, textarea {
      width: 100%; min-height: 48px; padding: 10px 14px;
      border: 1.5px solid var(--line); border-radius: 12px;
      font: inherit; background: #fbfbff; color: var(--ink);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    input::placeholder, textarea::placeholder { color: #9aa0c0; }
    input:focus, select:focus, textarea:focus {
      outline: none; background: #fff; border-color: var(--cobalt);
      box-shadow: 0 0 0 4px rgba(36, 56, 214, 0.18);
    }
    textarea { resize: vertical; min-height: 96px; }

    .msg {
      display: none; margin-top: 14px; padding: 12px 16px; border-radius: 12px;
      font-size: 0.95rem; font-weight: 500; white-space: pre-line;
    }
    .msg.show { display: block; }
    .msg.ok  { background: #dff5e8; color: #14532d; border: 1.5px solid #a9dfc1; }
    .msg.err { background: #fde8e8; color: #7f1d1d; border: 1.5px solid #f4b4b4; }

    /* โครงหน้า */
    .page {
      max-width: 1080px; margin: 0 auto; padding: 28px 18px 56px;
      display: grid; gap: 28px; grid-template-columns: 1fr;
    }
    @media (min-width: 900px) {
      .page { grid-template-columns: 380px 1fr; gap: 48px; padding-top: 56px; align-items: start; }
      .intro { position: sticky; top: 40px; }
    }
    .intro h1 { font-size: clamp(1.8rem, 4.5vw, 2.4rem); font-weight: 700; letter-spacing: -0.01em; }
    .intro p { margin: 10px 0 24px; color: var(--muted); max-width: 34ch; }

    /* บัตรตัวอย่าง */
    .idcard {
      position: relative; overflow: hidden;
      border-radius: 20px; padding: 22px 22px 20px; color: #fff;
      background:
        radial-gradient(circle at 105% -10%, rgba(255, 201, 60, 0.28) 0 22%, transparent 23%),
        linear-gradient(160deg, var(--cobalt) 0%, var(--cobalt-deep) 100%);
      box-shadow: 0 6px 0 #121d7a, 0 22px 40px rgba(26, 42, 168, 0.28);
      transform: rotate(-1.5deg);
    }
    @media (max-width: 899px) { .idcard { transform: none; } }
    .idcard-band { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: var(--sun); }
    .idcard-head {
      display: flex; align-items: center; gap: 10px; margin: 0 0 18px 8px;
      font-family: var(--font-display); font-weight: 600; font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
    }
    .idcard-mark {
      width: 22px; height: 22px; border-radius: 6px; background: var(--sun);
      box-shadow: inset -6px -6px 0 rgba(14, 19, 48, 0.18);
    }
    .idcard-body { display: flex; align-items: center; gap: 14px; margin-left: 8px; }
    .avatar {
      flex: none; width: 64px; height: 64px; border-radius: 16px;
      display: grid; place-items: center;
      background: var(--sun); color: var(--ink);
      font-family: var(--font-display); font-weight: 700; font-size: 1.8rem;
    }
    .idcard-id { min-width: 0; }
    .pv-name { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; line-height: 1.3; overflow-wrap: anywhere; }
    .pv-sid { margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: 0.08em; color: var(--sun); font-weight: 600; }
    .pv-empty { opacity: 0.55; font-weight: 400; letter-spacing: 0; }
    .idcard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin: 20px 0 0 8px; }
    .idcard-grid div { min-width: 0; }
    .idcard-grid dt { font-size: 0.78rem; color: rgba(255, 255, 255, 0.65); }
    .idcard-grid dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
    .pv-motto { margin: 18px 0 0 8px; padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.12); font-style: italic; overflow-wrap: anywhere; }

    .stamp {
      position: absolute; right: 16px; bottom: 18px; padding: 6px 14px;
      border: 3px solid var(--sun); border-radius: 10px; color: var(--sun);
      font-family: var(--font-display); font-weight: 700; font-size: 1.15rem;
      background: rgba(14, 19, 48, 0.55);
      transform: rotate(-9deg) scale(1); opacity: 0; pointer-events: none;
    }
    .stamp.show { animation: stamp-in 0.38s cubic-bezier(0.2, 1.4, 0.4, 1) forwards; }
    @keyframes stamp-in {
      from { opacity: 0; transform: rotate(-9deg) scale(1.9); }
      to   { opacity: 1; transform: rotate(-9deg) scale(1); }
    }

    /* การ์ดฟอร์ม */
    .formcard {
      background: var(--paper); border: 1.5px solid var(--line);
      border-radius: 20px; padding: 26px 22px; box-shadow: 0 6px 0 var(--line);
    }
    @media (min-width: 600px) { .formcard { padding: 32px 34px; } }
    .formcard h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 14px; }
    .formcard h2:not(:first-child) { margin-top: 28px; padding-top: 24px; border-top: 1.5px dashed var(--line); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid .full { grid-column: 1 / -1; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    .counter { margin-top: 4px; text-align: right; font-size: 0.8rem; color: var(--muted); }
    #submitBtn { width: 100%; margin-top: 26px; padding: 15px 20px; font-size: 1.05rem; }
    .footer-link { margin-top: 20px; text-align: center; font-size: 0.9rem; }
    .footer-link a { color: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">

    <!-- ซ้าย: บัตรตัวอย่างที่อัปเดตตามที่พิมพ์ -->
    <section class="intro">
      <h1>ลงทะเบียนนักศึกษา</h1>
      <p>กรอกข้อมูลในฟอร์ม บัตรด้านล่างจะเปลี่ยนตามที่คุณพิมพ์</p>

      <article class="idcard" aria-label="ตัวอย่างบัตรลงทะเบียน">
        <div class="idcard-band"></div>
        <div class="idcard-head"><span class="idcard-mark"></span><span>บัตรลงทะเบียน</span></div>

        <div class="idcard-body">
          <div class="avatar" id="pv_avatar">?</div>
          <div class="idcard-id">
            <div class="pv-name pv-empty" id="pv_name">ชื่อ นามสกุล</div>
            <div class="pv-sid pv-empty" id="pv_sid">เลขนักศึกษา</div>
          </div>
        </div>

        <dl class="idcard-grid">
          <div><dt>แผนก</dt><dd id="pv_department">-</dd></div>
          <div><dt>สาขา</dt><dd id="pv_branch">-</dd></div>
          <div><dt>ระดับชั้น</dt><dd id="pv_grade">-</dd></div>
          <div><dt>อายุ</dt><dd id="pv_age">-</dd></div>
        </dl>

        <blockquote class="pv-motto pv-empty" id="pv_motto">คติประจำใจจะแสดงที่นี่</blockquote>
        <div class="stamp" id="stamp" aria-hidden="true">ลงทะเบียนแล้ว</div>
      </article>
    </section>

    <!-- ขวา: ฟอร์ม -->
    <section>
      <div class="formcard">
        <form id="regForm" novalidate>
          <h2>ข้อมูลส่วนตัว</h2>
          <div class="grid">
            <div>
              <label for="first_name">ชื่อ <span class="req">*</span></label>
              <input id="first_name" name="first_name" maxlength="100" required autocomplete="given-name" />
            </div>
            <div>
              <label for="last_name">นามสกุล <span class="req">*</span></label>
              <input id="last_name" name="last_name" maxlength="100" required autocomplete="family-name" />
            </div>
            <div>
              <label for="age">อายุ <span class="req">*</span></label>
              <input id="age" name="age" type="number" min="1" max="120" inputmode="numeric" required />
            </div>
            <div>
              <label for="student_id">เลขนักศึกษา <span class="req">*</span></label>
              <input id="student_id" name="student_id" maxlength="30" inputmode="numeric" required />
            </div>
          </div>

          <h2>ข้อมูลการศึกษา</h2>
          <div class="grid">
            <div>
              <label for="department">แผนก <span class="req">*</span></label>
              <input id="department" name="department" maxlength="100" placeholder="เช่น แผนกช่างอิเล็กทรอนิกส์" required />
            </div>
            <div>
              <label for="branch">สาขา <span class="req">*</span></label>
              <input id="branch" name="branch" maxlength="100" placeholder="เช่น สาขาคอมพิวเตอร์" required />
            </div>
            <div class="full">
              <label for="grade_level">ระดับชั้น <span class="req">*</span></label>
              <select id="grade_level" name="grade_level" required>
                <option value="">เลือกระดับชั้น</option>
                <option>ปวช.1</option>
                <option>ปวช.2</option>
                <option>ปวช.3</option>
                <option>ปวส.1</option>
                <option>ปวส.2</option>
                <option>ปริญญาตรี ปี 1</option>
                <option>ปริญญาตรี ปี 2</option>
                <option>ปริญญาตรี ปี 3</option>
                <option>ปริญญาตรี ปี 4</option>
              </select>
            </div>
          </div>

          <h2>เกี่ยวกับคุณ</h2>
          <div>
            <label for="motto">คติประจำใจ</label>
            <textarea id="motto" name="motto" maxlength="300" placeholder="ประโยคสั้นๆ ที่เป็นแรงบันดาลใจของคุณ"></textarea>
            <div class="counter"><span id="mottoCount">0</span>/300</div>
          </div>

          <button type="submit" id="submitBtn">ลงทะเบียน</button>
          <div id="msg" class="msg" role="status" aria-live="polite"></div>
        </form>
      </div>
      <div class="footer-link"><a href="admin.html">สำหรับผู้ดูแลระบบ</a></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ===== ตั้งค่า Supabase (anon key เปิดเผยได้ เพราะสิทธิ์คุมด้วย RLS) =====
    const SUPABASE_URL = "https://akblfnnkaehzpqrgonya.supabase.co";
    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrYmxmbm5rYWVoenBxcmdvbnlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NDE0NTIsImV4cCI6MjExMDAxNzQ1Mn0.iBRXIgSzpg6gUSuzdXciTYJ7xc5ByG-RAbOrlqx8yZg";
    // ======================================================================

    const $ = (id) => document.getElementById(id);
    const form = $("regForm");
    const msg = $("msg");
    const btn = $("submitBtn");
    const stamp = $("stamp");

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = "msg show " + type;
    }

    const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
    if (!db) showMsg("โหลดไลบรารี Supabase ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้านี้", "err");

    // แปลสาเหตุที่พบบ่อยเป็นข้อความที่แก้ได้ทันที
    function explainError(err) {
      const m = String((err && err.message) || "");
      const c = String((err && err.code) || "");
      if (/failed to fetch|networkerror|load failed/i.test(m))
        return "เชื่อมต่อ Supabase ไม่ได้ ตรวจสอบอินเทอร์เน็ตและ SUPABASE_URL";
      if (/invalid api key|jwt/i.test(m) || c === "PGRST301")
        return "API key ไม่ถูกต้อง ตรวจสอบ SUPABASE_ANON_KEY";
      if (c === "PGRST205" || c === "42P01" || /could not find the table|does not exist/i.test(m))
        return "ยังไม่มีตาราง registrations ให้รัน schema.sql ใน Supabase";
      if (c === "PGRST204" || /could not find the .* column/i.test(m))
        return "คอลัมน์ในตารางไม่ตรงกับฟอร์ม ให้รัน schema.sql ใหม่";
      if (c === "42501" || /row-level security|permission denied/i.test(m))
        return "ถูกบล็อกโดยสิทธิ์ (RLS) ให้รัน schema.sql เพื่อสร้าง policy";
      if (c === "23514" || /check constraint/i.test(m))
        return "ข้อมูลไม่ผ่านเงื่อนไขของตาราง เช่น อายุหรือความยาวข้อความเกินกำหนด";
      return "";
    }

    // ---------- บัตรตัวอย่างแบบสด ----------
    function setText(id, value, placeholder) {
      const el = $(id);
      const empty = !value;
      el.textContent = empty ? placeholder : value;
      el.classList.toggle("pv-empty", empty && (id === "pv_name" || id === "pv_sid" || id === "pv_motto"));
    }

    function updatePreview() {
      const v = (id) => $(id).value.trim();
      const fullName = [v("first_name"), v("last_name")].filter(Boolean).join(" ");
      setText("pv_name", fullName, "ชื่อ นามสกุล");
      setText("pv_sid", v("student_id"), "เลขนักศึกษา");
      setText("pv_department", v("department"), "-");
      setText("pv_branch", v("branch"), "-");
      setText("pv_grade", v("grade_level"), "-");
      setText("pv_age", v("age"), "-");
      setText("pv_motto", v("motto") ? "“" + v("motto") + "”" : "", "คติประจำใจจะแสดงที่นี่");
      $("pv_avatar").textContent = Array.from(v("first_name"))[0] || "?";
      $("mottoCount").textContent = $("motto").value.length;
    }

    form.addEventListener("input", () => {
      stamp.classList.remove("show");
      updatePreview();
    });

    // ---------- ส่งข้อมูล ----------
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";
      if (!db) return;

      const v = (id) => $(id).value.trim();
      const payload = {
        first_name: v("first_name"),
        last_name: v("last_name"),
        age: parseInt(v("age"), 10),
        department: v("department"),
        branch: v("branch"),
        student_id: v("student_id"),
        grade_level: v("grade_level"),
        motto: v("motto") || null,
      };

      if (!payload.first_name || !payload.last_name || !payload.department ||
          !payload.branch || !payload.student_id || !payload.grade_level) {
        return showMsg("กรอกข้อมูลที่มีเครื่องหมาย * ให้ครบก่อนลงทะเบียน", "err");
      }
      if (!Number.isInteger(payload.age) || payload.age < 1 || payload.age > 120) {
        return showMsg("อายุต้องเป็นตัวเลขระหว่าง 1 ถึง 120", "err");
      }

      btn.disabled = true;
      btn.textContent = "กำลังลงทะเบียน...";
      const { error } = await db.from("registrations").insert(payload);
      btn.disabled = false;
      btn.textContent = "ลงทะเบียน";

      if (error) {
        if (error.code === "23505") {
          return showMsg("เลขนักศึกษานี้ลงทะเบียนไว้แล้ว ตรวจสอบเลขอีกครั้ง", "err");
        }
        console.error(error);
        const hint = explainError(error);
        const detail = [error.code, error.message].filter(Boolean).join(" : ");
        return showMsg(
          "ลงทะเบียนไม่สำเร็จ " + (hint || "ลองใหม่อีกครั้งในอีกสักครู่") +
          (detail ? "\n[รายละเอียด: " + detail + "]" : ""),
          "err"
        );
      }

      form.reset();                  // ล้างฟอร์ม แต่ปล่อยบัตรไว้พร้อมตราประทับ
      $("mottoCount").textContent = "0";
      stamp.classList.remove("show");
      void stamp.offsetWidth;        // รีสตาร์ทแอนิเมชัน
      stamp.classList.add("show");
      showMsg("ลงทะเบียนเรียบร้อยแล้ว", "ok");
    });
  </script>
</body>
</html>
